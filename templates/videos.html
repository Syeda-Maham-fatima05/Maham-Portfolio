<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Design Videos | Maham</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background: linear-gradient(135deg, #0D1B2A, #1B263B);
            color: white;
            font-family: 'Segoe UI', sans-serif;
        }
        /* NAVBAR */
        .navbar {
            background: rgba(0, 0, 0, 0.7) !important;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            padding: 12px 0;
            z-index: 1000;
        }

        .navbar-brand {
            font-size: 24px;
            font-weight: 800;
            letter-spacing: 2px;
            color: white !important;
            transition: 0.3s;
        }

        .navbar-brand:hover {
            color: #00f2fe !important;
        }

        .navbar .nav-link {
            color: rgba(255, 255, 255, 0.8) !important;
            font-size: 16px;
            font-weight: 500;
            transition: 0.3s;
            margin-left: 10px;
            margin-right: 10px;
        }

        .navbar .nav-link:hover,
        .navbar .nav-link.active {
            color: #00f2fe !important;
        }

        .navbar .btn-outline-info {
            border-color: #00f2fe !important;
            color: white !important;
            transition: 0.3s;
        }

        .navbar .btn-outline-info:hover {
            background: linear-gradient(90deg, #00f2fe, #4facfe) !important;
            border-color: transparent !important;
            color: white !important;
            transform: scale(1.05);
        }
        /* HERO */
        .hero {
            background: linear-gradient(rgba(0, 0, 0, 0.7), rgba(0, 0, 0, 0.7)), url("{{ url_for('static', filename='hero.png') }}");
            background-size: cover;
            background-position: center;
            padding: 100px 0;
            text-align: center;
            position: relative;
            overflow: hidden;
            box-shadow: inset 0 -20px 50px rgba(0,0,0,0.8);
        }
        .hero::after {
            content: "";
            position: absolute;
            width: 200%;
            height: 200%;
            background: radial-gradient(white 1px, transparent 1px);
            background-size: 45px 45px;
            opacity: 0.05;
            animation: sparkle 20s linear infinite;
        }
        @keyframes sparkle {
            from { transform: translate(0, 0); }
            to { transform: translate(-200px, -200px); }
        }
        .hero h1 {
            position: relative;
            z-index: 2;
            font-weight: 900;
            letter-spacing: 4px;
            text-transform: uppercase;
            color: white;
            text-shadow: 0 0 15px rgba(0,198,255,0.5);
        }
        .hero p {
            position: relative;
            z-index: 2;
            color: #00c6ff;
            font-size: 20px;
            letter-spacing: 2px;
        }

        /* SECTION */
        .section-box {
            background: rgba(255,255,255,0.05);
            backdrop-filter: blur(12px);
            border-radius: 20px;
            padding: 30px;
            border: 1px solid rgba(255,255,255,0.08);
            box-shadow: 0 10px 30px rgba(0,0,0,0.4);
        }

        /* VIDEO CARD */
        .video-card {
            border-radius: 15px;
            overflow: hidden;
            background: #000;
            transition: 0.3s ease;
            box-shadow: 0 10px 25px rgba(0,0,0,0.4);
        }

        .video-card:hover {
            transform: scale(1.03);
            box-shadow: 0 20px 40px rgba(0,0,0,0.6);
        }

        video {
            width: 100%;
            height: 320px; /* 🔥 Bigger video */
            object-fit: cover;
        }

        /* RESPONSIVE MEDIA QUERIES */
        @media (max-width: 768px) {
            .hero {
                padding: 60px 0;
            }
            .hero h1 {
                font-size: 26px !important;
            }
            .section-box {
                padding: 15px;
                border-radius: 15px;
            }
            video {
                height: 200px;
            }
        }
    </style>
</head>

<body>

<!-- NAVBAR -->
<nav class="navbar navbar-expand-lg navbar-dark">
    <div class="container">
        <a class="navbar-brand" href="{{ url_for('home') }}">MAHAM</a>

        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#nav" aria-controls="nav" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="nav">
            <ul class="navbar-nav ms-auto">
                <li class="nav-item">
                    <a class="nav-link{{ ' active' if request.path == '/' or request.path == url_for('home') }}" href="{{ url_for('home') }}">Home</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link{{ ' active' if request.path == '/about' or request.path == url_for('about') }}" href="{{ url_for('about') }}">About</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link{{ ' active' if request.path in ['/project', '/pictures', '/videos', url_for('projects'), url_for('pictures'), url_for('videos')] }}" href="{{ url_for('projects') }}">Projects</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link btn btn-outline-info rounded-pill px-3 ms-lg-3 text-white{{ ' active' if request.path == '/contact' or request.path == url_for('contact') }}" href="{{ url_for('contact') }}">Contact Me</a>
                </li>
            </ul>
        </div>
    </div>
</nav>

<!-- HERO -->
<section class="hero">
    <h1 class="fw-bold soft-text">Graphic Design - Videos</h1>
    <p>Animated & Motion Design Work</p>
</section>

<!-- CONTENT -->
<div class="container-fluid px-4 py-5">
    <div class="section-box">

        <div class="row g-4">

            <!-- Video 1 -->
            <div class="col-md-6">
                <div class="video-card">
                    <video controls>
                        <source src="{{ url_for('static', filename='projects/v1.mp4') }}" type="video/mp4">
                    </video>
                </div>
            </div>

            <!-- Video 2 -->
            <div class="col-md-6">
                <div class="video-card">
                    <video controls>
                        <source src="{{ url_for('static', filename='projects/v2.mp4') }}" type="video/mp4">
                    </video>
                </div>
            </div>

            <!-- Video 3 -->
            <div class="col-md-6">
                <div class="video-card">
                    <video controls>
                        <source src="{{ url_for('static', filename='projects/v3.mp4') }}" type="video/mp4">
                    </video>
                </div>
            </div>

            <!-- Video 4 -->
            <div class="col-md-6">
                <div class="video-card">
                    <video controls>
                        <source src="{{ url_for('static', filename='projects/v4.mp4') }}" type="video/mp4">
                    </video>
                </div>
            </div>

        </div>

    </div>
</div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
