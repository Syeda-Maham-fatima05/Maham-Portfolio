<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Design Pictures | Maham</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Lightbox -->
    <link href="https://cdn.jsdelivr.net/npm/lightbox2@2/dist/css/lightbox.min.css" rel="stylesheet">

    <!-- AOS -->
    <link href="https://unpkg.com/aos@2.3.4/dist/aos.css" rel="stylesheet">

    <style>
        body {
            background: linear-gradient(135deg, #0D1B2A, #1B263B);
            color: white;
            font-family: 'Segoe UI', sans-serif;
            overflow-x: hidden;
        }
        /* NAVBAR */
        .navbar {
            background: rgba(0, 0, 0, 0.7) !important;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            padding: 12px 0;
            z-index: 1000;
        }

        .navbar-brand {
            font-size: 24px;
            font-weight: 800;
            letter-spacing: 2px;
            color: white !important;
            transition: 0.3s;
        }

        .navbar-brand:hover {
            color: #00f2fe !important;
        }

        .navbar .nav-link {
            color: rgba(255, 255, 255, 0.8) !important;
            font-size: 16px;
            font-weight: 500;
            transition: 0.3s;
            margin-left: 10px;
            margin-right: 10px;
        }

        .navbar .nav-link:hover,
        .navbar .nav-link.active {
            color: #00f2fe !important;
        }

        .navbar .btn-outline-info {
            border-color: #00f2fe !important;
            color: white !important;
            transition: 0.3s;
        }

        .navbar .btn-outline-info:hover {
            background: linear-gradient(90deg, #00f2fe, #4facfe) !important;
            border-color: transparent !important;
            color: white !important;
            transform: scale(1.05);
        }

        /* HERO */
        .hero {
            background: linear-gradient(rgba(0, 0, 0, 0.7), rgba(0, 0, 0, 0.7)), url("{{ url_for('static', filename='hero.png') }}");
            background-size: cover;
            background-position: center;
            padding: 100px 0;
            text-align: center;
            position: relative;
            overflow: hidden;
            box-shadow: inset 0 -20px 50px rgba(0,0,0,0.8);
        }
        .hero::after {
            content: "";
            position: absolute;
            width: 200%;
            height: 200%;
            background: radial-gradient(white 1px, transparent 1px);
            background-size: 45px 45px;
            opacity: 0.05;
            animation: sparkle 20s linear infinite;
        }
        @keyframes sparkle {
            from { transform: translate(0, 0); }
            to { transform: translate(-200px, -200px); }
        }
        .hero h1 {
            position: relative;
            z-index: 2;
            font-weight: 900;
            letter-spacing: 4px;
            text-transform: uppercase;
            color: white;
            text-shadow: 0 0 15px rgba(0,198,255,0.5);
        }
        .hero p {
            position: relative;
            z-index: 2;
            color: #00c6ff;
            font-size: 20px;
            letter-spacing: 2px;
        }

        /* LAYOUT */
        .sections-layout {
            display: grid;
            grid-template-columns: 1fr;
            gap: 40px;
        }

        /* SECTION BOX */
        .section-box {
            background: rgba(255,255,255,0.05);
            backdrop-filter: blur(12px);
            border-radius: 25px;
            padding: 30px;
            border: 1px solid rgba(255,255,255,0.08);
            box-shadow: 0 10px 30px rgba(0,0,0,0.4);
            min-width: 0;
            max-width: 100%;
            transition: 0.3s;
        }

        .section-box:hover {
            box-shadow: 0 15px 40px rgba(0,198,255,0.15);
        }

        .section-box h2 {
            font-weight: 800;
            font-size: 26px;
            margin-bottom: 20px;
            color: #00c6ff;
            text-shadow: 0 0 10px rgba(0,198,255,0.3);
        }

        /* HORIZONTAL SCROLL */
        .section-scroll {
            display: flex;
            flex-wrap: nowrap;
            overflow-x: auto;
            gap: 20px;
            padding: 10px 20px 20px 20px;
        }

        .section-scroll::before,
        .section-scroll::after {
            content: '';
            margin: auto;
        }

        .section-scroll::-webkit-scrollbar {
            height: 8px;
        }

        .section-scroll::-webkit-scrollbar-thumb {
            background: #00c6ff;
            border-radius: 10px;
        }

        /* IMAGE CARD */
        .design-card {
            border-radius: 16px;
            overflow: hidden;
            position: relative;
            flex-shrink: 0;
            width: 200px;
            height: 200px;
            border: 2px solid rgba(255,255,255,0.1);
            transition: 0.3s;
        }

        .design-card:hover {
            border-color: #00c6ff;
            box-shadow: 0 8px 25px rgba(0,198,255,0.3);
            transform: translateY(-5px);
        }

        .design-card img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: 0.4s;
        }

        .design-card:hover img {
            transform: scale(1.1);
            filter: brightness(0.7);
        }

        /* Overlay */
        .overlay {
            position: absolute;
            top: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(transparent 40%, rgba(0,198,255,0.3));
            opacity: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: 0.3s;
        }

        .design-card:hover .overlay {
            opacity: 1;
        }

        .overlay-text {
            color: white;
            font-weight: bold;
            font-size: 16px;
            background: rgba(0,0,0,0.5);
            padding: 6px 18px;
            border-radius: 20px;
            letter-spacing: 1px;
        }

        /* RESPONSIVE MEDIA QUERIES */
        @media (max-width: 768px) {
            .hero {
                padding: 60px 0;
            }
            .hero h1 {
                font-size: 26px !important;
            }
            .section-box {
                padding: 15px;
                border-radius: 15px;
            }
            .design-card {
                width: 140px;
                height: 140px;
            }
        }
    </style>
</head>

<body>

<!-- NAVBAR -->
<nav class="navbar navbar-expand-lg navbar-dark">
    <div class="container">
        <a class="navbar-brand" href="{{ url_for('home') }}">MAHAM</a>

        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#nav" aria-controls="nav" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="nav">
            <ul class="navbar-nav ms-auto">
                <li class="nav-item">
                    <a class="nav-link{{ ' active' if request.path == '/' or request.path == url_for('home') }}" href="{{ url_for('home') }}">Home</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link{{ ' active' if request.path == '/about' or request.path == url_for('about') }}" href="{{ url_for('about') }}">About</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link{{ ' active' if request.path in ['/project', '/pictures', '/videos', url_for('projects'), url_for('pictures'), url_for('videos')] }}" href="{{ url_for('projects') }}">Projects</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link btn btn-outline-info rounded-pill px-3 ms-lg-3 text-white{{ ' active' if request.path == '/contact' or request.path == url_for('contact') }}" href="{{ url_for('contact') }}">Contact Me</a>
                </li>
            </ul>
        </div>
    </div>
</nav>

<!-- HERO -->
<section class="hero">
    <h1 class="fw-bold" data-aos="zoom-in" data-aos-duration="1000">Graphic Design - Pictures</h1>
    <p data-aos="fade-up" data-aos-delay="300">Emotes • Banners • Posters • Logos</p>
</section>

<!-- CONTENT -->
<div class="container-fluid px-4 py-5">
    <div class="sections-layout">

        <!-- LOGOS -->
        <div class="section-box" data-aos="fade-up" data-aos-duration="800">
            <h2>🎯 Logos</h2>
            <div class="section-scroll">
                <a href="{{ url_for('static', filename='projects/l1.png') }}" data-lightbox="logos">
                    <div class="design-card">
                        <img src="{{ url_for('static', filename='projects/l1.png') }}">
                        <div class="overlay"><div class="overlay-text">View</div></div>
                    </div>
                </a>

                {% for i in range(2,9) %}
                <a href="{{ url_for('static', filename='projects/l' + i|string + '.jpg') }}" data-lightbox="logos">
                    <div class="design-card">
                        <img src="{{ url_for('static', filename='projects/l' + i|string + '.jpg') }}">
                        <div class="overlay"><div class="overlay-text">View</div></div>
                    </div>
                </a>
                {% endfor %}
            </div>
        </div>

        <!-- EMOTES -->
        <div class="section-box" data-aos="fade-up" data-aos-duration="800" data-aos-delay="100">
            <h2>😎 Emotes</h2>
            <div class="section-scroll">
                {% for i in range(1,5) %}
                <a href="{{ url_for('static', filename='projects/e' + i|string + '.png') }}" data-lightbox="emotes">
                    <div class="design-card">
                        <img src="{{ url_for('static', filename='projects/e' + i|string + '.png') }}">
                        <div class="overlay"><div class="overlay-text">View</div></div>
                    </div>
                </a>
                {% endfor %}
            </div>
        </div>

        <!-- POSTERS -->
        <div class="section-box" data-aos="fade-up" data-aos-duration="800" data-aos-delay="200">
            <h2>🖼️ Posters</h2>
            <div class="section-scroll">
                <a href="{{ url_for('static', filename='projects/p1.jpg') }}" data-lightbox="posters">
                    <div class="design-card">
                        <img src="{{ url_for('static', filename='projects/p1.jpg') }}">
                        <div class="overlay"><div class="overlay-text">View</div></div>
                    </div>
                </a>

                <a href="{{ url_for('static', filename='projects/p2.png') }}" data-lightbox="posters">
                    <div class="design-card">
                        <img src="{{ url_for('static', filename='projects/p2.png') }}">
                        <div class="overlay"><div class="overlay-text">View</div></div>
                    </div>
                </a>

                <a href="{{ url_for('static', filename='projects/p3.jpg') }}" data-lightbox="posters">
                    <div class="design-card">
                        <img src="{{ url_for('static', filename='projects/p3.jpg') }}">
                        <div class="overlay"><div class="overlay-text">View</div></div>
                    </div>
                </a>

                <a href="{{ url_for('static', filename='projects/p4.jpg') }}" data-lightbox="posters">
                    <div class="design-card">
                        <img src="{{ url_for('static', filename='projects/p4.jpg') }}">
                        <div class="overlay"><div class="overlay-text">View</div></div>
                    </div>
                </a>

                <a href="{{ url_for('static', filename='projects/p5.jpg') }}" data-lightbox="posters">
                    <div class="design-card">
                        <img src="{{ url_for('static', filename='projects/p5.jpg') }}">
                        <div class="overlay"><div class="overlay-text">View</div></div>
                    </div>
                </a>
            </div>
        </div>

        <!-- BANNERS -->
        <div class="section-box" data-aos="fade-up" data-aos-duration="800" data-aos-delay="300">
            <h2>🏳️ Banners</h2>
            <div class="section-scroll">
                <a href="{{ url_for('static', filename='projects/b1.jpg') }}" data-lightbox="banners">
                    <div class="design-card">
                        <img src="{{ url_for('static', filename='projects/b1.jpg') }}">
                        <div class="overlay"><div class="overlay-text">View</div></div>
                    </div>
                </a>

                <a href="{{ url_for('static', filename='projects/b2.jpg') }}" data-lightbox="banners">
                    <div class="design-card">
                        <img src="{{ url_for('static', filename='projects/b2.jpg') }}">
                        <div class="overlay"><div class="overlay-text">View</div></div>
                    </div>
                </a>
            </div>
        </div>

    </div>
</div>

<!-- Lightbox -->
<script src="https://cdn.jsdelivr.net/npm/lightbox2@2/dist/js/lightbox.min.js"></script>

<!-- AOS -->
<script src="https://unpkg.com/aos@2.3.4/dist/aos.js"></script>
<script>
    AOS.init();
</script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
