<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Maham Portfolio</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- AOS -->
    <link href="https://unpkg.com/aos@2.3.4/dist/aos.css" rel="stylesheet">
    <!-- Particles -->
    <script src="https://cdn.jsdelivr.net/npm/particles.js"></script>
    <style>
        body { background:#0D1B2A; color:white; font-family:'Segoe UI',sans-serif; overflow-x:hidden; }
        #particles-js { position:fixed; width:100%; height:100%; z-index:0; }
        .navbar { background:rgba(0,0,0,0.7)!important; backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px); padding:12px 0; z-index:1000; }
        .navbar-brand { font-size:24px; font-weight:800; letter-spacing:2px; color:white!important; transition:0.3s; }
        .navbar-brand:hover { color:#00f2fe!important; }
        .navbar .nav-link { color:rgba(255,255,255,0.8)!important; font-size:16px; font-weight:500; transition:0.3s; margin-left:10px; margin-right:10px; }
        .navbar .nav-link:hover,.navbar .nav-link.active { color:#00f2fe!important; }
        .navbar .btn-outline-info { border-color:#00f2fe!important; color:white!important; transition:0.3s; }
        .navbar .btn-outline-info:hover { background:linear-gradient(90deg,#00f2fe,#4facfe)!important; border-color:transparent!important; color:white!important; transform:scale(1.05); }
        .hero { height:100vh; display:flex; align-items:center; position:relative; z-index:2; }
        .cursor-glow { position:fixed; width:300px; height:300px; background:radial-gradient(circle,rgba(0,242,254,0.15),transparent); border-radius:50%; pointer-events:none; transform:translate(-50%,-50%); z-index:1; }
        .glass-box { background:rgba(255,255,255,0.05); backdrop-filter:blur(12px); border-radius:20px; padding:30px; border:1px solid rgba(255,255,255,0.1); box-shadow:0 10px 40px rgba(0,0,0,0.5); animation:fadeUp 1.2s ease; }
        @keyframes fadeUp { from{opacity:0;transform:translateY(40px);} to{opacity:1;transform:translateY(0);} }
        .typing { color:#00f2fe; border-right:2px solid #00f2fe; white-space:normal; overflow:hidden; min-height:60px; }
        .hero-text h1 { font-size:48px; font-weight:700; }
        .btn-custom { border-radius:30px; padding:10px 25px; transition:0.3s; }
        .btn-custom:hover { transform:scale(1.08); }
        .hero-img img { width:500px; height:500px; object-fit:cover; border-radius:50%; border:4px solid rgba(255,255,255,0.2); box-shadow:0 20px 50px rgba(0,0,0,0.7); }
        @media (max-width:991px){ .hero-img img{width:380px;height:380px;} }
        @media (max-width:767px){ .hero{height:auto;min-height:100vh;padding-top:100px;padding-bottom:50px;} .hero-img img{width:280px;height:280px;margin-top:30px;} .hero-text{text-align:center;} .hero-text h1{font-size:32px;} .glass-box{padding:20px;} }
        @media (max-width:576px){ .hero{padding-top:80px;padding-bottom:30px;} .hero-text h1{font-size:34px!important;line-height:1.2;text-align:center;margin-bottom:15px;} .hero-text .glass-box{padding:15px;text-align:center;} .hero-text .btn-custom{width:100%;margin-bottom:10px;} .hero-img{margin-top:20px;} .hero-img img{width:240px;height:240px;} }
    </style>
</head>
<body>
    <div id="particles-js"></div>
    <div class="cursor-glow" id="glow"></div>
    <nav class="navbar navbar-expand-lg navbar-dark">
        <div class="container">
            <a class="navbar-brand" href="{{ url_for('home') }}">MAHAM</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#nav" aria-controls="nav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="nav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link{{ ' active' if request.path == '/' or request.path == url_for('home') }}" href="{{ url_for('home') }}">Home</a></li>
                    <li class="nav-item"><a class="nav-link{{ ' active' if request.path == '/about' or request.path == url_for('about') }}" href="{{ url_for('about') }}">About</a></li>
                    <li class="nav-item"><a class="nav-link{{ ' active' if request.path in ['/project','/pictures','/videos',url_for('projects'),url_for('pictures'),url_for('videos')] }}" href="{{ url_for('projects') }}">Projects</a></li>
                    <li class="nav-item"><a class="nav-link btn btn-outline-info rounded-pill px-3 ms-lg-3 text-white{{ ' active' if request.path == '/contact' or request.path == url_for('contact') }}" href="{{ url_for('contact') }}">Contact Me</a></li>
                </ul>
            </div>
        </div>
    </nav>
    <section class="hero">
        <div class="container">
            <div class="row align-items-center">
                <div class="col-md-6 hero-text">
                    <h1 class="typing" id="typing-text"></h1>
                    <div class="glass-box mt-4">
                        <p class="lead mb-2">I design and build smart systems, scalable web apps, and visually engaging digital experiences.</p>
                        <p class="mb-0">Blending engineering logic with creative design to solve real-world problems.</p>
                    </div>
                    <div class="mt-4">
                        <a href="/project" class="btn btn-primary btn-custom me-2 mb-2">View Work</a>
                        <a href="/about" class="btn btn-outline-light btn-custom me-2 mb-2">About Me</a>
                        <a href="/contact" class="btn btn-primary btn-custom me-2 mb-2">Contact Me</a>
                    </div>
                </div>
                <div class="col-md-6 text-center hero-img">
                    <img src="{{ url_for('static', filename='maham.png') }}">
                </div>
            </div>
        </div>
    </section>
    <script>
        const text = "Developer • Designer • Engineer";
        let i = 0;
        function typeEffect(){ if(i < text.length){ document.getElementById("typing-text").innerHTML += text.charAt(i); i++; setTimeout(typeEffect,40); } }
        typeEffect();
    </script>
    <script>
        const glow = document.getElementById("glow");
        document.addEventListener("mousemove", e => { glow.style.left = e.clientX + "px"; glow.style.top = e.clientY + "px"; });
    </script>
    <script>
        particlesJS("particles-js",{ particles:{ number:{value:60}, size:{value:3}, move:{speed:1}, line_linked:{enable:true, opacity:0.2} } });
    </script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
